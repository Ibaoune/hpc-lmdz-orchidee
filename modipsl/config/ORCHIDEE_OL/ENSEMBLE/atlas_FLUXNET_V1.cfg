input=$@
paper=-p
quality=cx1800
#cx800 cx1200
#frequency=1:12:6
echo $input
#reference_file=RRRRRRR
#validation directory=VVVVVVV
debug=
#-d

# Ratio one day over time step
one_day=86400
ratio=$(( one_day/1800 ))

pwd

cp ../ORCHIDEE_3dif.jnl .
#----------------------

echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "PFT distribution" -o  pft ORCHIDEE_pft.jnl \
                                                                      "\"PFT distribution\" RRRRRRR inputfile MAXVEGETFRAC"


for freq in Day Month Year
do
    if [ $freq = Day ] 
    then
	ssbx=10
    else 
	ssbx=1
    fi

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Sensible heat flux : $freq" -o  fluxsens_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Sensible heat flux : $freq\" VVVVVVV RRRRRRR inputfile H_f Qh $freq \"W/m2\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Latent heat flux : $freq" -o  fluxlat_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Latent heat flux : $freq\" VVVVVVV RRRRRRR inputfile LE_f Qle $freq \"W/m2\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Net radiation : $freq" -o  netrad_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Net radiation : $freq\" VVVVVVV RRRRRRR inputfile Rn_f swnet+lwnet $freq \"W/m2\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Ground heat flux : $freq" -o  groundheat_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Ground heat flux : $freq\" VVVVVVV RRRRRRR inputfile g_f Qg $freq \"W/m2\" $ssbx"


    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Surface Temperature : $freq" -o  tsoil_$freq ORCHIDEE_3dif.jnl \
                                                                       "\"Surface Temperature : $freq\" VVVVVVV RRRRRRR inputfile Ts1_f (AvgSurfT-273.15) $freq \"degC\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Potential evapotranspiration : $freq" -o  epot_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Potential evapotranspiration : $freq\" VVVVVVV RRRRRRR inputfile (Epot_f*24) (PotEvap*${one_day}) $freq \"mm/d\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Soil moisture content 1 : $freq" -o  humr1_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Soil moisture content 1 : $freq\" VVVVVVV RRRRRRR inputfile SWC1_f SoilWet*100 $freq \"%\" $ssbx"

    ext_coef=0.5
    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "LAI : $freq" -o  lai_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"lai : $freq\" VVVVVVV RRRRRRR inputfile (Ts1_f/4) (0.-maxvegetfrac*ln(1.-vegetfrac/maxvegetfrac)/$ext_coef) $freq \"1\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "LAI vs FAPAR : $freq" -o  lai_fapar_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"lai vs FAPAR : $freq\" VVVVVVV RRRRRRR inputfile (-1.*ln(1.-FAPAR)/($ext_coef)) (0.-maxvegetfrac*ln(1.-vegetfrac/maxvegetfrac)/$ext_coef) $freq \"1\" $ssbx"


    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Net Ecosystem Exchange : $freq" -o  nee_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Net Ecosystem Exchange : $freq\" VVVVVVV RRRRRRR inputfile (NEE*${ratio}) (NEE*${one_day}) $freq \"gC/m2/day\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Gross Primary Productivity : $freq" -o  gpp_$freq ORCHIDEE_3dif.jnl \
                                                                           "\"Gross Primary Productivity : $freq\" VVVVVVV RRRRRRR inputfile (GPP*${ratio}) (GPP*${one_day}) $freq \"gC/m2/day\" $ssbx"

    echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -p -i "Total Ecosystem Respiration : $freq" -o  reco_$freq ORCHIDEE_3dif.jnl \
                                                                      "\"Total Ecosystem Respiration : $freq\" VVVVVVV RRRRRRR inputfile (Reco*${ratio}) ((maint_resp+hetero_resp+growth_resp)*${one_day}) $freq \"gC/m2/day\" $ssbx"

done




# Diurnal cycle

let ANNEE=0
while [ $ANNEE -lt $DUREE ]; do
  let ANNEE2=$ANNEE+1
  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "Sensible heat flux : climatologie_${ANNEE2}" -o  fluxsens_day ORCHIDEE_12day.jnl \
                                                                                               "\"Sensible heat flux\" VVVVVVV RRRRRRR inputfile H_f Qh sloop"

  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "Latent heat flux : climatologie_${ANNEE2}" -o  fluxlat_day ORCHIDEE_12day.jnl \
                                                                                               "\"Latent heat flux\" VVVVVVV RRRRRRR inputfile LE_f Qle sloop"

  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "Net radiation : climatologie_${ANNEE2}" -o  netrad_day ORCHIDEE_12day.jnl \
                                                                                               "\"Net radiation\" VVVVVVV RRRRRRR inputfile Rn_f swnet+lwnet sloop"

  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "Ground heat flux : climatologie_${ANNEE2}" -o  groundheat_day ORCHIDEE_12day.jnl \
                                                                                               "\"Ground heat flux\" VVVVVVV RRRRRRR inputfile g_f Qg sloop"


  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "Surface Temperature : climatologie_${ANNEE2}" -o  tsoil_day ORCHIDEE_12day.jnl \
                                                                                               "\"Surface Temperature\" VVVVVVV RRRRRRR inputfile Ts1_f (AvgSurfT-273.15) sloop"

  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "gpp : climatologie_${ANNEE2}" -o  gpp_day ORCHIDEE_12day.jnl \
                                                                                               "\"GPP\" VVVVVVV RRRRRRR inputfile (GPP*${ratio}) (GPP*${one_day}) sloop" 

  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "nee : climatologie_${ANNEE2}" -o  nee_day ORCHIDEE_12day.jnl \
                                                                                               "\"nee\" VVVVVVV RRRRRRR inputfile (NEE*${ratio}) (NEE*${one_day}) sloop" 

  echo $input | ferretloop - ${debug} --ps2gif_option "-g $quality" -s ${ANNEE}:${ANNEE}:1 -p -i "Ecosystem respiration : climatologie_${ANNEE2}" -o reco_day ORCHIDEE_12day.jnl \
                                                                                               "\"Ecosystem respiration\" VVVVVVV RRRRRRR inputfile (Reco*${ratio}) ((maint_resp+hetero_resp+growth_resp)*${one_day}) sloop"

  let ANNEE=$ANNEE+1
done
